descriptor:
  name: Water Line Control for 2.9+ (singlethread fork)
  key: water-line-control-2.9-singlethread
  currentVersion: 2.9+
  description: Program for the automation of Grade 3 to 8 water production, with singlethread quantity control of Grade 1 to 8
  repositoryLink: https://github.com/Willshaper/GTNH-OC-Water-Line-Control
  versions:
    - name: 2.9+
      url: "https://raw.githubusercontent.com/Willshaper/GTNH-OC-Water-Line-Control/refs/heads/develop/config-descriptor.yml"
  fieldGroups:
    - key: general
      name: General
      defaultOpen: true
      fields:
        - key: autoUpdate
          type: boolean
          optional: true
          default: true
          class: checkbox
          label: Enable Auto Update
          description: Enable program automatic update

        - key: autoStart
          type: boolean
          optional: true
          default: true
          class: checkbox
          label: Enable Auto Start
          description: Switch the Water Purification Plant on when the program starts. Stopping the program switches it off

    - key: logger
      name: Logger
      defaultOpen: true
      fields:
        - key: name
          type: string
          default: Water Line Control
          label: Name
          description: Name of the logger

        - key: timeZone
          type: integer
          default: 3
          label: Time Zone
          description: Your time zone

    - key: discord
      name: Discord
      defaultOpen: false
      fields:
        - key: discordWebhookUrl
          type: url
          default: ""
          optional: true
          label: Webhook URL
          description: Channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL. Empty is off. Needs an internet card

        - key: discordName
          type: string
          default: ""
          optional: true
          label: Name
          description: Shown in each message, to tell several computers apart

        - key: discordMention
          type: string
          default: ""
          optional: true
          label: Mention
          description: Pinged on red messages, a user <@123456789> or a role <@&123456789>. Discord only pings IDs. Empty is nobody

        - key: discordReminderHours
          type: integer
          default: 0
          min: 0
          label: Reminder Hours
          description: Hours between reminders while a unit still needs attention or the plant is still stopped. 0 is none

        - key: discordNeedsAttention
          type: boolean
          optional: true
          default: true
          class: checkbox
          label: Needs attention
          description: A unit needs attention, and is back in use

        - key: discordPlantStopped
          type: boolean
          optional: true
          default: true
          class: checkbox
          label: Plant stopped
          description: The Water Purification Plant stopped, and runs again

        - key: discordUnitDidNotStart
          type: boolean
          optional: true
          default: true
          class: checkbox
          label: Unit didn't start
          description: A unit was chosen for 2 cycles in a row but didn't start, and starts again

        - key: discordErrors
          type: boolean
          optional: true
          default: true
          class: checkbox
          label: Errors
          description: The program had an error, runs again, or stopped after 5 minutes of errors

        - key: discordStarted
          type: boolean
          optional: true
          default: true
          class: checkbox
          label: Started
          description: The program started

    - key: t1
      name: T1 Water
      defaultOpen: true
      fields:
        - key: t1Enable
          type: boolean
          optional: true
          default: false
          class: switch
          label: Enable T1 Module
          description: Enable module for T1 water

    - key: t2
      name: T2 Water
      defaultOpen: true
      fields:
        - key: t2Enable
          type: boolean
          optional: true
          default: false
          class: switch
          label: Enable T2 Module
          description: Enable module for T2 water

    - key: t3
      name: T3 Water
      defaultOpen: true
      fields:
        - key: t3Enable
          type: boolean
          optional: true
          default: false
          class: switch
          label: Enable T3 Module
          description: Enable module for T3 water

        - key: t3TransposerAddress
          type: address
          default: ""
          optional: true
          label: Polyaluminium Chloride Transposer Address
          description: Address of transposer which provide Polyaluminium Chloride

    - key: t4
      name: T4 Water
      defaultOpen: true
      fields:
        - key: t4Enable
          type: boolean
          optional: true
          default: false
          class: switch
          label: Enable T4 Module
          description: Enable module for T4 water

        - key: t4HydrochloricAcidTransposerAddress
          type: address
          default: ""
          optional: true
          label: Hydrochloric Acid Transposer Address
          description: Address of transposer which provide Hydrochloric Acid

        - key: t4SodiumHydroxideTransposerAddress
          type: address
          default: ""
          optional: true
          label: Sodium Hydroxide Transposer Address
          description: Address of transposer which provide Sodium Hydroxide Dust

    - key: t5
      name: T5 Water
      defaultOpen: true
      fields:
        - key: t5Enable
          type: boolean
          optional: true
          default: false
          class: switch
          label: Enable T5 Module
          description: Enable module for T5 water

        - key: t5PlasmaTransposerAddress
          type: address
          default: ""
          optional: true
          label: Plasma Transposer Address
          description: Address of transposer which provide Helium Plasma

        - key: t5CoolantTransposerAddress
          type: address
          default: ""
          optional: true
          label: Coolant Transposer Address
          description: Address of transposer which provide Super Coolant

    - key: t6
      name: T6 Water
      defaultOpen: true
      fields:
        - key: t6Enable
          type: boolean
          optional: true
          default: false
          class: switch
          label: Enable T6 Module
          description: Enable module for T6 water

        - key: t6TransposerAddress
          type: address
          default: ""
          optional: true
          label: Lenses Transposer Address
          description: Address of transposer which provide Lenses

    - key: t7
      name: T7 Water
      defaultOpen: true
      fields:
        - key: t7Enable
          type: boolean
          optional: true
          default: false
          class: switch
          label: Enable T7 Module
          description: Enable module for T7 water

        - key: t7InertGasTransposerAddress
          type: address
          default: ""
          optional: true
          label: Inert Gas Transposer Address
          description: Address of transposer which provide Inert Gas

        - key: t7SuperConductorTransposerAddress
          type: address
          default: ""
          optional: true
          label: Super Conductor Transposer Address
          description: Address of transposer which provide Super Conductor

        - key: t7NetroniumTransposerAddress
          type: address
          default: ""
          optional: true
          label: Netronium Transposer Address
          description: Address of transposer which provide Molten Neutronium

        - key: t7CoolantTransposerAddress
          type: address
          default: ""
          optional: true
          label: Coolant Transposer Address
          description: Address of transposer which provide Super Coolant

    - key: t8
      name: T8 Water
      defaultOpen: true
      fields:
        - key: t8Enable
          type: boolean
          optional: true
          default: false
          class: switch
          label: Enable T8 Module
          description: Enable module for T8 water

        - key: t8MaxQuarkCount
          type: integer
          default: 4
          min: 1
          label: Max Quark Count
          description: Maximum number of each quark in the sub AE

        - key: t8TransposerAddress
          type: address
          default: ""
          optional: true
          label: Transposer Address
          description: Address of transposer which provide Quarks

        - key: t8SubMeInterfaceAddress
          type: address
          default: ""
          optional: true
          label: Sub ME Interface Address
          description: Address of me interface which connected to sub AE

    - key: quantityController
      name: Quantity Controller
      defaultOpen: true
      fields:
        - key: qcControlMode
          type: select
          default: disabled
          label: Control Mode
          description: Which units run, from the amount of each water in the ME network
          options:
            - label: Disabled (every enabled unit runs)
              value: disabled
            - label: Multi thread (every tier below its threshold runs)
              value: multiThread
            - label: Single thread (lowest tier below its threshold runs)
              value: singleThread
            - label: Single thread balancing (tier with the least water runs)
              value: singleThreadBalancing

        - key: qcMeInterfaceAddress
          type: address
          default: ""
          optional: true
          label: ME Interface Address
          description: Address of me interface on the network which stores the water

        - key: qcFloorQty
          type: integer
          default: 1000000
          min: 0
          label: Floor Quantity
          description: Single thread balancing fills every water to this first, lowest tier first. 0 skips this stage

        - key: qcMinQty
          type: integer
          default: 8000000
          min: 0
          label: Min Quantity
          description: Single thread balancing then fills every water to this, lowest tier first. At least one cycle's input (parallels * 1000), more builds a reserve

        - key: qcThresholdT1
          type: integer
          default: 32000000
          min: 0
          label: T1 Threshold
          description: Amount of T1 water to keep stocked, in L. 0 is no cap

        - key: qcThresholdT2
          type: integer
          default: 32000000
          min: 0
          label: T2 Threshold
          description: Amount of T2 water to keep stocked, in L. 0 is no cap

        - key: qcThresholdT3
          type: integer
          default: 32000000
          min: 0
          label: T3 Threshold
          description: Amount of T3 water to keep stocked, in L. 0 is no cap

        - key: qcThresholdT4
          type: integer
          default: 32000000
          min: 0
          label: T4 Threshold
          description: Amount of T4 water to keep stocked, in L. 0 is no cap

        - key: qcThresholdT5
          type: integer
          default: 32000000
          min: 0
          label: T5 Threshold
          description: Amount of T5 water to keep stocked, in L. 0 is no cap

        - key: qcThresholdT6
          type: integer
          default: 32000000
          min: 0
          label: T6 Threshold
          description: Amount of T6 water to keep stocked, in L. 0 is no cap

        - key: qcThresholdT7
          type: integer
          default: 32000000
          min: 0
          label: T7 Threshold
          description: Amount of T7 water to keep stocked, in L. 0 is no cap

        - key: qcThresholdT8
          type: integer
          default: 32000000
          min: 0
          label: T8 Threshold
          description: Amount of T8 water to keep stocked, in L. 0 is no cap

        - key: qcThresholdBaryonicMatter
          type: integer
          default: 32000000
          min: 0
          label: Stabilised Baryonic Matter Threshold
          description: Amount of Stabilised Baryonic Matter to keep stocked, in L. 0 is no cap. T8 makes it, and it is needed to realign quark catalysts

  configTemplate: |
    local config = {
      enableAutoUpdate = <field>autoUpdate</field>, -- Enable auto update on start
      enableAutoStart = <field>autoStart</field>, -- Switch the Water Purification Plant on when the program starts. Stopping the program switches it off

      logger = {
        name = "<field>name</field>",
        timeZone = <field>timeZone</field>, -- Your time zone
        handlers = {
          ["file"] = {
            type = "file",
            logLevel = "debug",
            messageFormat = "{Time:%d.%m.%Y %H:%M:%S} [{LogLevel}]: {Message}",
            filePath = "logs.log"
          },
          ["scrollList"] = {
            type = "scrollList",
            logLevel = "debug",
            messageFormat = "{Time:%H:%M} {Message}",
            logsListSize = 32
          },
        }
      },

      discord = { -- Messages to a Discord channel through a webhook. Needs an internet card
        webhookUrl = "<field>discordWebhookUrl</field>", -- "" is off
        name = "<field>discordName</field>", -- Shown in each message, to tell several computers apart
        mention = "<field>discordMention</field>", -- Pinged on red messages: a user "<@123456789>" or a role "<@&123456789>". "" is nobody
        reminderHours = <field>discordReminderHours</field>, -- Hours between reminders while a unit still needs attention or the plant is still stopped. 0 is none
        needsAttention = <field>discordNeedsAttention</field>, -- A unit needs attention, and is back in use
        plantStopped = <field>discordPlantStopped</field>, -- The Water Purification Plant stopped, and runs again
        unitDidNotStart = <field>discordUnitDidNotStart</field>, -- A unit was chosen for 2 cycles in a row but didn't start, and starts again
        errors = <field>discordErrors</field>, -- The program had an error, runs again, or stopped after 5 minutes of errors
        started = <field>discordStarted</field> -- The program started
      },

      controllers = {
        t1 = { -- Controller for T1 Filtered Water (Grade 1)
          enable = <field>t1Enable</field> -- Enable module for T1 water
        },

        t2 = { -- Controller for T2 Ozonated Water (Grade 2)
          enable = <field>t2Enable</field> -- Enable module for T2 water
        },

        t3 = { -- Controller for T3 Flocculated Water (Grade 3)
          enable = <field>t3Enable</field>, -- Enable module for T3 water
          transposerAddress = "<field>t3TransposerAddress</field>" -- Address of transposer which provide Polyaluminium Chloride
        },

        t4 = { -- Controller for T4 pH Neutralized Water (Grade 4)
          enable = <field>t4Enable</field>, -- Enable module for T4 water
          hydrochloricAcidTransposerAddress = "<field>t4HydrochloricAcidTransposerAddress</field>", -- Address of transposer which provide Hydrochloric Acid
          sodiumHydroxideTransposerAddress = "<field>t4SodiumHydroxideTransposerAddress</field>" -- Address of transposer which provide Sodium Hydroxide Dust
        },

        t5 = { -- Controller for T5 Extreme-Temperature Treated Water (Grade 5)
          enable = <field>t5Enable</field>, -- Enable module for T5 water
          plasmaTransposerAddress = "<field>t5PlasmaTransposerAddress</field>", -- Address of transposer which provide Helium Plasma
          coolantTransposerAddress = "<field>t5CoolantTransposerAddress</field>" -- Address of transposer which provide Super Coolant
        },

        t6 = { -- Controller for T6 Ultraviolet Treated Electrically Neutral Water (Grade 6)
          enable = <field>t6Enable</field>, -- Enable module for T6 water
          transposerAddress = "<field>t6TransposerAddress</field>" -- Address of transposer which provide Lenses
        },

        t7 = { -- Controller for T7 Degassed Decontaminant-Free Water (Grade 7)
          enable = <field>t7Enable</field>, -- Enable module for T7 water
          inertGasTransposerAddress = "<field>t7InertGasTransposerAddress</field>", -- Address of transposer which provide Inert Gas
          superConductorTransposerAddress = "<field>t7SuperConductorTransposerAddress</field>", -- Address of transposer which provide Super Conductor
          netroniumTransposerAddress = "<field>t7NetroniumTransposerAddress</field>", -- Address of transposer which provide Molten Neutronium
          coolantTransposerAddress = "<field>t7CoolantTransposerAddress</field>" -- Address of transposer which provide Super Coolant
        },

        t8 = { -- Controller for T8 Subatomically Perfect Water (Grade 8)
          enable = <field>t8Enable</field>, -- Enable module for T8 water
          maxQuarkCount = <field>t8MaxQuarkCount</field>, -- Maximum number of each quark in the sub AE
          transposerAddress = "<field>t8TransposerAddress</field>", -- Address of transposer which provide Quarks
          subMeInterfaceAddress = "<field>t8SubMeInterfaceAddress</field>" -- Address of me interface which connected to sub AE
        }
      },

      quantityController = { -- Decides which units run, from the amount of each water in the ME network
        controlMode = "<field>qcControlMode</field>", -- "disabled", "multiThread", "singleThread" or "singleThreadBalancing"
        meInterfaceAddress = "<field>qcMeInterfaceAddress</field>", -- Address of me interface on the network which stores the water

        -- singleThreadBalancing picks one unit each cycle, in this order:
        -- 1. A water under floorQty: the lowest tier runs
        -- 2. A water under minQty: the lowest tier runs
        -- 3. Otherwise the water with the least stock (under its threshold) runs
        floorQty = <field>qcFloorQty</field>, -- Every water is filled to this first (singleThreadBalancing)
        minQty = <field>qcMinQty</field>, -- Then every water is filled to this (singleThreadBalancing). At least one cycle's input (parallels * 1000), more builds a reserve
        waterThresholds = { -- Amount to keep stocked, in L. 0: no cap, the water keeps being made
          t1 = <field>qcThresholdT1</field>,
          t2 = <field>qcThresholdT2</field>,
          t3 = <field>qcThresholdT3</field>,
          t4 = <field>qcThresholdT4</field>,
          t5 = <field>qcThresholdT5</field>,
          t6 = <field>qcThresholdT6</field>,
          t7 = <field>qcThresholdT7</field>,
          t8 = <field>qcThresholdT8</field>,
          stabilisedBaryonicMatter = <field>qcThresholdBaryonicMatter</field> -- Made by T8, needed to realign quark catalysts
        }
      }
    }

    return config

